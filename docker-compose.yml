services:
  girl-agent:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      - "${GIRL_AGENT_WEB_PORT:-3000}:3000"
    environment:
      GIRL_AGENT_PROFILE: "${GIRL_AGENT_PROFILE:-}"
      GIRL_AGENT_DEBUG: "${GIRL_AGENT_DEBUG:-0}"
      GIRL_AGENT_WEB_TOKEN: "${GIRL_AGENT_WEB_TOKEN:-}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
